  <script>
    const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTMFZgzCkVhBJ-_Yh_hHi9lol16OW0rnHFSSVV16ai58WzNboOefIqC5HfCqIklrX-rTFLK2vdA5b2V/pub?output=csv";

    const ANGKATAN_TARGET = "2023";
    const DEFAULT_PHOTO = "img/default-user.png";

    const clean = value => String(value ?? "").trim();

    const escapeHTML = value =>
      clean(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    function convertDriveUrl(url) {
      url = clean(url);

      if (!url) return "";

      const match =
        url.match(/[?&]id=([\w-]+)/) ||
        url.match(/\/file\/d\/([\w-]+)/) ||
        url.match(/\/d\/([\w-]+)/);

      return match
        ? `https://drive.google.com/thumbnail?id=${match[1]}&sz=w500`
        : url;
    }

    function parseCSV(csv) {
      const rows = [];
      let row = [];
      let cell = "";
      let quoted = false;

      for (let i = 0; i < csv.length; i++) {
        const char = csv[i];
        const next = csv[i + 1];

        if (char === '"' && quoted && next === '"') {
          cell += '"';
          i++;
        } else if (char === '"') {
          quoted = !quoted;
        } else if (char === "," && !quoted) {
          row.push(cell.trim());
          cell = "";
        } else if ((char === "\n" || char === "\r") && !quoted) {
          if (char === "\r" && next === "\n") i++;

          row.push(cell.trim());

          if (row.some(Boolean)) {
            rows.push(row);
          }

          row = [];
          cell = "";
        } else {
          cell += char;
        }
      }

      row.push(cell.trim());

      if (row.some(Boolean)) {
        rows.push(row);
      }

      return rows;
    }

    function memberCard(member) {
      const detail = (label, value, className = "") =>
        value
          ? `<p class="${className}">${label ? `${label}: ` : ""}${escapeHTML(value)}</p>`
          : "";

      const photo = convertDriveUrl(member.foto) || DEFAULT_PHOTO;

      return `
        <article class="anggota-card">
          <img
            src="${escapeHTML(photo)}"
            alt="Foto ${escapeHTML(member.nama)}"
            loading="lazy"
            onerror="this.onerror=null;this.src='${DEFAULT_PHOTO}'"
          >

          <h3>${escapeHTML(member.nama)}</h3>
          ${detail("", member.nim, "nim")}
          ${detail("Status", member.status)}
          ${detail("Divisi", member.divisi)}
          ${detail("Jabatan", member.jabatan)}
        </article>
      `;
    }


    async function fetchSheetCSV() {

      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 15000);

      try {
        const response = await fetch(`${SHEET_URL}&_=${Date.now()}`, {
          method: "GET",
          cache: "no-store",
          signal: controller.signal
        });

        if (!response.ok) {
          throw new Error(`Google Sheets mengembalikan HTTP ${response.status}.`);
        }

        const text = await response.text();

        if (!text.trim()) {
          throw new Error("CSV Google Sheets kosong.");
        }

        return text;
      } finally {
        clearTimeout(timeout);
      }
    }

    async function loadMembers() {
      const container = document.getElementById("anggota-container");

      try {
        const csvText = await fetchSheetCSV();
        const rows = parseCSV(csvText);

        if (!rows.length) {
          throw new Error("Data Google Sheets kosong.");
        }

        const headers = rows[0].map(clean);
        const indexOf = name => headers.indexOf(name);

        const required = [
          "Nama Lengkap",
          "Kategori",
          "STAMBUK / NIM",
          "Angkatan",
          "Status",
          "Divisi",
          "Jabatan Pengurus Inti",
          "Jabatan Pengurus",
          "Potret / Foto Anda"
        ];

        const missing = required.filter(name => indexOf(name) === -1);

        if (missing.length) {
          throw new Error(`Kolom tidak ditemukan: ${missing.join(", ")}.`);
        }

        const get = (row, name) => clean(row[indexOf(name)]);

        const members = rows
          .slice(1)
          .filter(row => get(row, "Angkatan") === ANGKATAN_TARGET)
          .map(row => ({
            nama: get(row, "Nama Lengkap"),
            nim: get(row, "STAMBUK / NIM"),
            status: get(row, "Status"),
            divisi: get(row, "Divisi"),
            jabatan:
              get(row, "Jabatan Pengurus Inti") ||
              get(row, "Jabatan Pengurus"),
            foto: get(row, "Potret / Foto Anda")
          }))
          .filter(member => member.nama)
          .sort((a, b) =>
            a.nim.localeCompare(b.nim, "id", {
              numeric: true,
              sensitivity: "base"
            })
          );

        container.innerHTML = members.length
          ? members.map(memberCard).join("")
          : `<p class="message">Belum ada data anggota Angkatan ${ANGKATAN_TARGET}.</p>`;
      } catch (error) {
        console.error(error);

        container.innerHTML = `<p class="message">Data anggota belum dapat dimuat.<br><small>${error.message}</small></p>`;
      }
    }

    loadMembers();
  </script>

  document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
})();
