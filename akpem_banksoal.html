<div class="container">

<!-- LOGIN -->
<div id="loginBox" class="login-box">
<h2>Akses Bank Soal</h2>
<p>Masukkan kode akses yang diberikan</p>

<input type="password" id="password" placeholder="Kode akses">
<br><br>
<button onclick="cekLogin()">Masuk</button>
</div>

<!-- KONTEN BANK SOAL -->
<div id="konten" style="display:none;">
<div id="banksoal-container"></div>
</div>

</div>
<script>

// 🔒 PASSWORD GLOBAL
const PASSWORD = "himafi2026";

// LOGIN FUNCTION
function cekLogin(){
const input = document.getElementById("password").value;

if(input === PASSWORD){
document.getElementById("loginBox").style.display = "none";
document.getElementById("konten").style.display = "block";
loadData();
}else{
alert("Kode salah!");
}
}

// LOAD DATA DARI GOOGLE SHEETS
function loadData(){
fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vQmUQd5BpNJWyTbcuHfIe9PQiSNJ_hw92pizz8DbPilZCX_TMcjCuj1zR6Wap33PFfHTG3svgOFSY3s/pub?output=csv")
.then(res=>res.text())
.then(data=>{
const rows=data.split("\n").slice(1);

let html="";

rows.forEach(row=>{
const col=row.split(",");

if(col[0] && col[1]){
html+=`
<div class="file-card">
<a href="${col[1]}" target="_blank">
📄 ${col[0]}
</a>
</div>
`;
}
});

document.getElementById("banksoal-container").innerHTML=html;
});
}

</script>

<script>

(() => {
  const button=document.querySelector(".site-menu-toggle"), menu=document.querySelector(".site-menu"), backdrop=document.querySelector(".site-menu-backdrop");
  if(!button||!menu||!backdrop)return;
  const close=()=>{document.body.classList.remove("site-menu-open");button.setAttribute("aria-expanded","false");button.textContent="☰";button.setAttribute("aria-label","Buka menu navigasi")};
  button.addEventListener("click",()=>{const open=document.body.classList.toggle("site-menu-open");button.setAttribute("aria-expanded",String(open));button.textContent=open?"×":"☰";button.setAttribute("aria-label",open?"Tutup menu navigasi":"Buka menu navigasi")});
  backdrop.addEventListener("click",close); menu.querySelectorAll("a").forEach(a=>a.addEventListener("click",close));
  document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
})();

</script>
